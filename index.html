<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards de Física - Fenômenos da Luz</title>
<style>
  * {
      box-sizing: border-box;
          margin: 0;
              padding: 0;
                }

                  body {
                      font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
                          background-color: #cfe8fb;
                              min-height: 100vh;
                                  display: flex;
                                      flex-direction: column;
                                          align-items: center;
                                              justify-content: flex-start;
                                                  padding: 30px 15px;
                                                      color: #0d3b66;
                                                        }

                                                          header {
                                                              text-align: center;
                                                                  margin-bottom: 30px;
                                                                    }

                                                                      header h1 {
                                                                          font-size: 2rem;
                                                                              color: #0d3b66;
                                                                                  letter-spacing: 1px;
                                                                                    }

                                                                                      header h2 {
                                                                                          font-size: 1.1rem;
                                                                                              font-weight: 400;
                                                                                                  margin-top: 6px;
                                                                                                      color: #14507a;
                                                                                                        }

                                                                                                          .container {
                                                                                                              width: 100%;
                                                                                                                  max-width: 550px;
                                                                                                                      display: flex;
                                                                                                                          flex-direction: column;
                                                                                                                              align-items: center;
                                                                                                                                }

                                                                                                                                  .counter {
                                                                                                                                      font-size: 1rem;
                                                                                                                                          margin-bottom: 12px;
                                                                                                                                              font-weight: 600;
                                                                                                                                                  color: #0d3b66;
                                                                                                                                                    }

                                                                                                                                                      .progress-bar-wrapper {
                                                                                                                                                          width: 100%;
                                                                                                                                                              background-color: #a9d3f2;
                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                      height: 12px;
                                                                                                                                                                          margin-bottom: 25px;
                                                                                                                                                                              overflow: hidden;
                                                                                                                                                                                }

                                                                                                                                                                                  .progress-bar-fill {
                                                                                                                                                                                      height: 100%;
                                                                                                                                                                                          background-color: #0d3b66;
                                                                                                                                                                                              width: 20%;
                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                      transition: width 0.4s ease;
                                                                                                                                                                                                        }

                                                                                                                                                                                                          .flashcard-scene {
                                                                                                                                                                                                              width: 100%;
                                                                                                                                                                                                                  height: 300px;
                                                                                                                                                                                                                      perspective: 1200px;
                                                                                                                                                                                                                          margin-bottom: 25px;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                              .flashcard {
                                                                                                                                                                                                                                  position: relative;
                                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                                          height: 100%;
                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                  transform-style: preserve-3d;
                                                                                                                                                                                                                                                      transition: transform 0.6s ease;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                          .flashcard.flipped {
                                                                                                                                                                                                                                                              transform: rotateY(180deg);
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                  .card-face {
                                                                                                                                                                                                                                                                      position: absolute;
                                                                                                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                                                                                              height: 100%;
                                                                                                                                                                                                                                                                                  background-color: #0d3b66;
                                                                                                                                                                                                                                                                                      border-radius: 20px;
                                                                                                                                                                                                                                                                                          display: flex;
                                                                                                                                                                                                                                                                                              align-items: center;
                                                                                                                                                                                                                                                                                                  justify-content: center;
                                                                                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                                                                                          padding: 30px;
                                                                                                                                                                                                                                                                                                              backface-visibility: hidden;
                                                                                                                                                                                                                                                                                                                  box-shadow: 0 8px 20px rgba(13, 59, 102, 0.35);
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                      .card-face p {
                                                                                                                                                                                                                                                                                                                          color: #ffffff;
                                                                                                                                                                                                                                                                                                                              font-size: 1.3rem;
                                                                                                                                                                                                                                                                                                                                  line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                      word-wrap: break-word;
                                                                                                                                                                                                                                                                                                                                          overflow-wrap: break-word;
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                              .card-front {
                                                                                                                                                                                                                                                                                                                                                  z-index: 2;
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                      .card-back {
                                                                                                                                                                                                                                                                                                                                                          transform: rotateY(180deg);
                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                              .label {
                                                                                                                                                                                                                                                                                                                                                                  position: absolute;
                                                                                                                                                                                                                                                                                                                                                                      top: 16px;
                                                                                                                                                                                                                                                                                                                                                                          left: 20px;
                                                                                                                                                                                                                                                                                                                                                                              font-size: 0.75rem;
                                                                                                                                                                                                                                                                                                                                                                                  text-transform: uppercase;
                                                                                                                                                                                                                                                                                                                                                                                      letter-spacing: 1px;
                                                                                                                                                                                                                                                                                                                                                                                          color: #a9d3f2;
                                                                                                                                                                                                                                                                                                                                                                                              font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                  .controls {
                                                                                                                                                                                                                                                                                                                                                                                                      display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                          gap: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                              flex-wrap: wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                  justify-content: center;
                                                                                                                                                                                                                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                                                                                                                              background-color: #14507a;
                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #ffffff;
                                                                                                                                                                                                                                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                          padding: 12px 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 0.95rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              transition: background-color 0.25s ease, transform 0.15s ease;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  box-shadow: 0 4px 10px rgba(13, 59, 102, 0.25);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          background-color: #0d3b66;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(-2px);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button:active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      transform: translateY(0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .btn-flip {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background-color: #0d3b66;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  footer {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-top: 35px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 0.95rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #14507a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-style: italic;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          padding-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              @media (max-width: 480px) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  header h1 {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 1.5rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                header h2 {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-size: 1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .flashcard-scene {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    height: 260px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .card-face p {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 1.1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                padding: 10px 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h1>FLASHCARDS DE FÍSICA</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Fenômenos da Luz</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="counter" id="counter">Card 1 de 5</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="progress-bar-wrapper">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="progress-bar-fill" id="progressBar"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="flashcard-scene">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="flashcard" id="flashcard">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card-face card-front">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span class="label">Pergunta</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p id="questionText"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card-face card-back">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <span class="label">Resposta</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p id="answerText"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="controls">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="prevBtn">Anterior</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="flipBtn" class="btn-flip">Virar Card</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="nextBtn">Próximo</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Aprenda, vire o card e teste seus conhecimentos.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const flashcards = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pergunta: "O que é a reflexão da luz?",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  resposta: "Reflexão é o fenômeno em que a luz atinge uma superfície e retorna para o meio de onde veio. Um exemplo é o reflexo que vemos em um espelho."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                pergunta: "O que é a refração da luz?",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      resposta: "Refração é a mudança de direção e velocidade da luz quando ela passa de um meio para outro, como quando a luz passa do ar para a água."
